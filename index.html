    <script>
      (function() {
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const isSubdir = window.location.pathname.toLowerCase().startsWith('/aegisos');
        const basePath = (isLocal && isSubdir) ? '/AegisOS' : '';
        const baseHref = basePath ? (basePath + '/') : '/';
        document.write('<base href="' + baseHref + '">');

        const origFetch = window.fetch;
        window.fetch = function(input, init) {
          let url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
          if (basePath && url) {
            if (url.startsWith('/api/os/')) {
              url = basePath + url;
            } else if (url.startsWith('api/os/')) {
              url = basePath + '/' + url;
            } else if (url.startsWith('./api/os/')) {
              url = basePath + url.substring(1);
            }
            if (typeof input === 'string') {
              input = url;
            } else if (input && input.url) {
              input = new Request(url, init || input);
            }
          }
          return origFetch.call(this, input, init);
        };
        if (window.EventSource) {
          const origES = window.EventSource;
          window.EventSource = function(url, options) {
            if (basePath && typeof url === 'string') {
              if (url.startsWith('/api/os/')) url = basePath + url;
              else if (url.startsWith('api/os/')) url = basePath + '/' + url;
            }
            return new origES(url, options);
          };
        }

        // Only run mirror pull polling when on localhost
        if (isLocal) {
          let isSyncing = false;
          async function syncMirrorUpdates() {
            if (isSyncing) return;
            isSyncing = true;
            try {
              await origFetch(basePath + '/api/os/remote-buffer/pull', { method: 'POST' });
            } catch(e) {
            } finally {
              isSyncing = false;
            }
          }
          setInterval(syncMirrorUpdates, 4000);
        }
      })();
    </script>
